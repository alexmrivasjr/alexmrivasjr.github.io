name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Site & script checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No `npm ci` needed: the check script uses only Node built-ins.
      - name: Links, JSON, and JS syntax
        run: npm run check
