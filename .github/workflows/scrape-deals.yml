name: Scrape soil & compost deals

on:
  schedule:
    - cron: "0 13 * * *" # ~6am Pacific / 9am Eastern, daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-deals
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape retailers
        run: npm run scrape

      - name: Send push notification for new deals
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: npm run send-push

      - name: Commit updated deals data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/notified.json
          git diff --cached --quiet || git commit -m "Update deals data [skip ci]"
          git push
