name: Scrape WA Lottery scratch-off data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "tiers = scrape prize-tier tables; winners-recon = dump winners-search page structure; winners = scrape+filter recent winners"
        required: false
        default: "tiers"
        type: choice
        options:
          - tiers
          - winners-recon
          - winners
      game_ids:
        description: "Space-separated game IDs to scrape (mode=tiers only)"
        required: false
        default: "1927 1971 1972 1988"
      cities:
        description: "Comma-separated cities to filter winners to (mode=winners only)"
        required: false
        default: "Kennewick,Pasco,Richland,West Richland,Burbank,Finley"
      days:
        description: "How many days back to filter winners to (mode=winners only)"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: scrape-lottery
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape WA Lottery prize tiers
        if: ${{ github.event.inputs.mode == 'tiers' }}
        run: |
          IDS=""
          for id in ${{ github.event.inputs.game_ids }}; do IDS="$IDS --id $id"; done
          node scripts/lottery/scrape.js $IDS --dump

      - name: Run EV / profit-probability analysis
        if: ${{ github.event.inputs.mode == 'tiers' }}
        run: node scripts/lottery/analyze.js scripts/lottery/data/scraped-games.json || true

      - name: Recon winners-search page structure
        if: ${{ github.event.inputs.mode == 'winners-recon' }}
        run: node scripts/lottery/recon-winners.js

      - name: Scrape recent winners
        if: ${{ github.event.inputs.mode == 'winners' }}
        env:
          WINNER_CITIES: ${{ github.event.inputs.cities }}
          WINNER_DAYS: ${{ github.event.inputs.days }}
        run: node scripts/lottery/scrape-winners.js --days "$WINNER_DAYS" --cities "$WINNER_CITIES"

      - name: Commit scraped data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/lottery/data
          git diff --cached --quiet || git commit -m "Update WA Lottery scraped data [skip ci]"
          git push
